name: On-Demand Multi-Platform Flipbook Builder

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: 'Kitap Adı (Örn: Abonelik Sozlesmesi Davalari)'
        required: true
        default: 'abonelik-soz-kaynak-alacak-d'
      identifier:
        description: 'Paket Kimliği (Örn: com.dosdijital.flipbook.alacakdavalari)'
        required: true
        default: 'com.dosdijital.flipbook.abonelik-soz-kaynak-alacak-d'
      window_title:
        description: 'Pencere Üst Başlığı'
        required: true
        default: 'ABONELİK SÖZLEŞMESİNDEN KAYNAKLANAN ALACAK DAVALARI'
      pdf_file_name:
        description: 'public/docs Klasöründeki PDF Dosya Adı'
        required: true
        default: 'abonelik-soz-kaynak-alacak-d.pdf'
      gdrive_id:
        description: 'Google Drive File ID'
        required: true
        default: '12bUyssRXoe8gdOA3uCfeBjeutjlkIdWi'
      platform:
        description: 'Hedef Platform (windows, macos, linux, android)'
        required: true
        default: 'windows'

  # 🌟 WOOCOMMERCE WEBHOOK TETİKLEYİCİSİ
  repository_dispatch:
    types: [build-flipbook]

jobs:
  # 🌟 PLATFORM TESPİTİ VE İŞLETİM SİSTEMİ EŞLEŞTİRMESİ
  setup-build:
    runs-on: ubuntu-latest
    outputs:
      target_os: ${{ steps.set-os.outputs.target_os }}
      target_platform: ${{ steps.set-os.outputs.target_platform }}
    steps:
      - id: set-os
        run: |
          PLATFORM="${{ github.event.inputs.platform || github.event.client_payload.platform || 'windows' }}"
          echo "target_platform=$PLATFORM" >> $GITHUB_OUTPUT
          
          if [ "$PLATFORM" = "macos" ]; then
            echo "target_os=macos-latest" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "linux" ] || [ "$PLATFORM" = "android" ]; then
            echo "target_os=ubuntu-latest" >> $GITHUB_OUTPUT
          else
            echo "target_os=windows-latest" >> $GITHUB_OUTPUT
          fi

  # 🌟 DİNAMİK MASAÜSTÜ VE MOBİL DERLEMESİ
  build-tauri:
    needs: setup-build
    runs-on: ${{ needs.setup-build.outputs.target_os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (Android İçin)
        if: needs.setup-build.outputs.target_platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK (Built-in)
        if: needs.setup-build.outputs.target_platform == 'android'
        shell: bash
        run: |
          NDK_PATH="$ANDROID_HOME/ndk-bundle"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          fi
          
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Android NDK Yolu Ayarlandı: $NDK_PATH"

      # 🌟 EKLENECEK YER: GRADLE CACHE ADIMI
      - name: Setup Gradle Cache
        if: needs.setup-build.outputs.target_platform == 'android'
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ needs.setup-build.outputs.target_platform == 'android' && 'aarch64-linux-android' || '' }}

      # 🌟 DERLEME SÜRESİNİ DÜŞÜREN RUST CACHE
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install System Dependencies (Linux Only)
        if: runner.os == 'Linux' && needs.setup-build.outputs.target_platform != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - name: Install dependencies
        run: npm install

      # 🌟 DİNAMİK DEĞİŞKENLERİ HAZIRLAMA
      - name: Set Build Variables
        shell: bash
        run: |
          PRODUCT_NAME="${{ github.event.inputs.product_name || github.event.client_payload.product_name }}"
          IDENTIFIER="${{ github.event.inputs.identifier || github.event.client_payload.identifier }}"
          WINDOW_TITLE="${{ github.event.inputs.window_title || github.event.client_payload.window_title }}"
          PDF_FILE_NAME="${{ github.event.inputs.pdf_file_name || github.event.client_payload.pdf_file_name }}"
          GDRIVE_ID="${{ github.event.inputs.gdrive_id || github.event.client_payload.gdrive_id }}"

          echo "PRODUCT_NAME=$PRODUCT_NAME" >> $GITHUB_ENV
          echo "IDENTIFIER=$IDENTIFIER" >> $GITHUB_ENV
          echo "WINDOW_TITLE=$WINDOW_TITLE" >> $GITHUB_ENV
          echo "PDF_FILE_NAME=$PDF_FILE_NAME" >> $GITHUB_ENV
          echo "GDRIVE_ID=$GDRIVE_ID" >> $GITHUB_ENV

      - name: Build Frontend Assets
        run: npm run build --if-present

      # 🌟 JS İÇİNDEKİ PDF YOLUNU ENJEKTE ETME (CROSS-PLATFORM BASH)
      - name: Inject Active PDF File Name
        shell: bash
        run: |
          if [ -f "renderer.js" ]; then
            sed -i "s/ACTIVE_PDF_FILE/$PDF_FILE_NAME/g" renderer.js || sed -i '' "s/ACTIVE_PDF_FILE/$PDF_FILE_NAME/g" renderer.js
            echo "PDF enjekte edildi: $PDF_FILE_NAME"
          fi

      # 🌟 GOOGLE DRIVE'DAN PDF İNDİRME ADIMI (CROSS-PLATFORM BASH) (public/docs/ KLASÖRÜNE)
      - name: Install gdown & Download PDF from Google Drive
        shell: bash
        run: |
          python3 -m pip install gdown || python -m pip install gdown
          mkdir -p public/docs
          gdown "https://drive.google.com/uc?id=$GDRIVE_ID" -O "public/docs/$PDF_FILE_NAME"
          
          if [ -f "public/docs/$PDF_FILE_NAME" ]; then
            echo "PDF basariyla indirildi: public/docs/$PDF_FILE_NAME"
          else
            echo "HATA: PDF indirilemedi!"
            exit 1
          fi

      # 🌟 FRONTEND VE PDF VARLIKLARINI BİR ARAYA GETİRME (PUBLIC KLASÖRÜ)
      - name: Prepare Frontend Assets in Public Directory
        shell: bash
        run: |
          # 1. Hedef alt klasörlerin varlığından emin ol
          mkdir -p public/docs public/js public/css
          
          # 2. Kök dizindeki web varlıklarını public klasörüne kopyala
          cp index.html public/ 2>/dev/null || true
          cp renderer.js public/ 2>/dev/null || true
          cp style.css public/ 2>/dev/null || true

          # 3. Alt klasörleri (js, css, docs) hiyerarşik olarak kopyala
          cp -r js/* public/js/ 2>/dev/null || true
          cp -r css/* public/css/ 2>/dev/null || true
          cp -r docs/* public/docs/ 2>/dev/null || true
          cp *.js public/ 2>/dev/null || true
          
          # 4. Google Drive'dan indirilen PDF'in yerinde olduğunu doğrula
          echo "Public klasörü içeriği:"
          ls -la public/
          echo "Public/docs klasörü içeriği (PDF Kontrolü):"
          ls -la public/docs/
          echo "Frontend varlıkları public/ klasörüne toplandı."

      # 🌟 DİNAMİK TAURI CONFIG DOSYASI OLUŞTURMA (CROSS-PLATFORM BASH)
      - name: Generate Dynamic Tauri Config File
        shell: bash
        run: |
          SAFE_PRODUCT_NAME="${PDF_FILE_NAME%.pdf}"
          
          cat <<EOF > src-tauri/temp-config.json
          {
            "productName": "$SAFE_PRODUCT_NAME",
            "identifier": "$IDENTIFIER",
            "build": {
              "beforeBuildCommand": "",
              "frontendDist": "../public",
              "devUrl": "http://localhost:5173"
            },
            "app": {
              "windows": [
                { "title": "$WINDOW_TITLE" }
              ]
            }
          }
          EOF
          cp src-tauri/temp-config.json temp-config.json
          echo "Geçici Config Üretildi:"
          cat temp-config.json

      # 🌟 MASAÜSTÜ DERLEMESİ (Windows / Mac / Linux)
      - name: Build Tauri Desktop App
        if: needs.setup-build.outputs.target_platform != 'android' && needs.setup-build.outputs.target_platform != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_TOKEN }}
        with:
          tagName: v1.0.${{ github.run_number }}
          releaseName: '${{ github.event.inputs.product_name || github.event.client_payload.product_name }} - v1.0.${{ github.run_number }}'
          releaseDraft: false
          prerelease: false
          args: --config temp-config.json

      # 🌟 MOBİL DERLEME (Android APK - Tauri v2 - Sadece 64-bit ARM)
      - name: Build Tauri Android App
        if: needs.setup-build.outputs.target_platform == 'android'
        shell: bash
        run: |
          # 1. Önce geçici config'i tauri.conf.json üzerine kopyala
          cp temp-config.json src-tauri/tauri.conf.json
          
          # 2. Doğru identifier ile Android projesini ilklendir
          npm run tauri android init
          
          # 3. Sadece 64-bit ARM için hızlı APK derlemesi
          npm run tauri android build -- --target aarch64 --config temp-config.json

      # 🌟 APK DOSYASINI İMZALAMA (SIGNING) VE YENİDEN ADLANDIRMA
      - name: Sign & Rename Generated APK
        if: needs.setup-build.outputs.target_platform == 'android'
        shell: bash
        run: |
          SAFE_NAME="${PDF_FILE_NAME%.pdf}"
          TARGET_APK_NAME="${SAFE_NAME}_1.0.0_apk-universal.apk"
          
          # 1. İmzasız APK dosyasını bul
          ORIGINAL_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          
          if [ -f "$ORIGINAL_APK" ]; then
            echo "İmzasız APK Bulundu: $ORIGINAL_APK"
            
            # 2. Anlık KeyStore (Anahtar Deposu) Oluştur
            keytool -genkey -v -keystore release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=DosDijital, OU=Flipbook, O=Dos, L=Ankara, C=TR"
            
            # 3. APK'yı Otomatik İmza İle İmzala
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out "public/docs/$TARGET_APK_NAME" "$ORIGINAL_APK"
            
            echo "APK Basariyla İmzalandi ve Kaydedildi: public/docs/$TARGET_APK_NAME"
          else
            echo "HATA: Derlenen APK dosyasi bulunamadi!"
            exit 1
          fi

      # 🌟 İMZALANMIŞ APK DOSYASINI GITHUB RELEASES'A YÜKLEME
      - name: Upload Signed Android APK to Release
        if: needs.setup-build.outputs.target_platform == 'android'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: '${{ github.event.inputs.product_name || github.event.client_payload.product_name }} (Android) - v1.0.${{ github.run_number }}'
          files: public/docs/*_apk-universal.apk