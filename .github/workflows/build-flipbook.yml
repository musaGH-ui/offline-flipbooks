name: On-Demand Multi-Platform Flipbook Builder

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: 'Kitap Adı (Örn: Abonelik Sozlesmesi Davalari)'
        required: true
        default: 'Abonelik Söz. Kaynak.Alacak D.'
      identifier:
        description: 'Paket Kimliği (Örn: com.dosdijital.flipbook.alacakdavalari)'
        required: true
        default: 'com.dosdijital.flipbook.abonelik-söz-kaynak-alacak-d'
      window_title:
        description: 'Pencere Üst Başlığı'
        required: true
        default: 'ABONELİK SÖZLEŞMESİNDEN KAYNAKLANAN ALACAK DAVALARI'
      pdf_file_name:
        description: 'public/docs Klasöründeki PDF Dosya Adı'
        required: true
        default: 'abonelik-soz-kaynak-alacak-d.pdf'
      gdrive_id:
        description: 'Google Drive File ID'
        required: true
        default: '12bUyssRXoe8gdOA3uCfeBjeutjlkIdWi'
      platform:
        description: 'Hedef Platform (windows, macos, linux, android)'
        required: true
        default: 'windows'
  # 🌟 WOOCOMMERCE WEBHOOK TETİKLEYİCİSİ:
  repository_dispatch:
    types: [build-flipbook]
jobs:
  # 🌟 PLATFORM TESPİTİ VE İŞLETİM SİSTEMİ EŞLEŞTİRMESİ
  setup-build:
    runs-on: ubuntu-latest
    outputs:
      target_os: ${{ steps.set-os.outputs.target_os }}
      target_platform: ${{ steps.set-os.outputs.target_platform }}
    steps:
      - id: set-os
        run: |
          PLATFORM="${{ github.event.inputs.platform || github.event.client_payload.platform || 'windows' }}"
          echo "target_platform=$PLATFORM" >> $GITHUB_OUTPUT
          
          if [ "$PLATFORM" = "macos" ]; then
            echo "target_os=macos-latest" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "linux" ] || [ "$PLATFORM" = "android" ]; then
            echo "target_os=ubuntu-latest" >> $GITHUB_OUTPUT
          else
            echo "target_os=windows-latest" >> $GITHUB_OUTPUT
          fi
  # 🌟 DİNAMİK MASAÜSTÜ VE MOBİL DERLEMESİ
  build-tauri:
    needs: setup-build
    runs-on: ${{ needs.setup-build.outputs.target_os }}
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (Android İçin)
        if: needs.setup-build.outputs.target_platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android NDK
        if: needs.setup-build.outputs.target_platform == 'android'
        uses: nsetup/setup-android-ndk@v1
        with:
          ndk-version: r25c
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ needs.setup-build.outputs.target_platform == 'android' && 'aarch64-linux-android armv7-linux-androideabi' || '' }}
        # 🌟 DERLEME SÜRESİNİ 10 DAKİKADAN 2 DAKİKAYA DÜŞÜREN RUST CACHE
      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install System Dependencies (Linux Only)
        if: runner.os == 'Linux' && needs.setup-build.outputs.target_platform != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: Install dependencies
        run: npm install
        
      # 🌟 DİNAMİK DEĞİŞKENLERİ HAZIRLAMA (Hem Manuel hem Webhook destekler)
      - name: Set Build Variables
        shell: bash
        run: |
          PRODUCT_NAME="${{ github.event.inputs.product_name || github.event.client_payload.product_name }}"
          IDENTIFIER="${{ github.event.inputs.identifier || github.event.client_payload.identifier }}"
          WINDOW_TITLE="${{ github.event.inputs.window_title || github.event.client_payload.window_title }}"
          PDF_FILE_NAME="${{ github.event.inputs.pdf_file_name || github.event.client_payload.pdf_file_name }}"
          GDRIVE_ID="${{ github.event.inputs.gdrive_id || github.event.client_payload.gdrive_id }}"

          echo "PRODUCT_NAME=$PRODUCT_NAME" >> $GITHUB_ENV
          echo "IDENTIFIER=$IDENTIFIER" >> $GITHUB_ENV
          echo "WINDOW_TITLE=$WINDOW_TITLE" >> $GITHUB_ENV
          echo "PDF_FILE_NAME=$PDF_FILE_NAME" >> $GITHUB_ENV
          echo "GDRIVE_ID=$GDRIVE_ID" >> $GITHUB_ENV
          
      # 🌟 YENİ ADIM 1: Frontend Build (dist klasörünü oluşturur)
      
      - name: Build Frontend Assets
        run: |
          npm run build --if-present
          
      # 🌟 YENİ ADIM: JS İÇİNDEKİ PDF YOLUNU DİNAMİK OLARAK DEĞİŞTİRİR
      - name: Inject Active PDF File Name
        shell: powershell
        run: |
          $jsFile = "renderer.js" # Veya PDF yolunu tanımladığın JS/HTML dosyasının yolu
          if (Test-Path $jsFile) {
            (Get-Content $jsFile -Raw) -replace 'ACTIVE_PDF_FILE', "$env:PDF_FILE_NAME" | Set-Content $jsFile
            Write-Host "PDF dosyasi basariyla enjekte edildi: $env:PDF_FILE_NAME"
          } else {
            Write-Host "JS dosyasi bulunamadi, varsayılan PDF kullaniliyor."
          }

     # 🌟 GOOGLE DRIVE'DAN PDF İNDİRME ADIMI
      - name: Install gdown & Download PDF from Google Drive
        shell: powershell
        run: |
          # Python indirme kütüphanesini yükle
          python -m pip install gdown

          # public/docs klasörünü oluştur
          New-Item -ItemType Directory -Force -Path "public/docs"

          # Webhook veya manuel girişten gelen Google Drive File ID
          $fileId = "$env:GDRIVE_ID"
          $pdfName = "$env:PDF_FILE_NAME"

          Write-Host "Google Drive'dan indiriliyor... File ID: $fileId"
          
          # Google Drive'dan dosyayı indirir ve hedef isme adlandırır
          gdown "https://drive.google.com/uc?id=$fileId" -O "public/docs/$pdfName"
          
          if (Test-Path "public/docs/$pdfName") {
            Write-Host "PDF basariyla Google Drive'dan indirildi: public/docs/$pdfName"
          } else {
            Write-Host "HATA: PDF Google Drive'dan indirilemedi!"
            exit 1
          } 

      # 🌟 YENİ ADIM: Dinamik Config Dosyasını Disk Üzerinde Oluşturma
      - name: Generate Dynamic Tauri Config File
        shell: powershell
        run: |
          # Doğrudan PDF adından (.pdf uzantısı sökülerek) temiz SKU/Slug elde edilir
          $safeProductName = "$env:PDF_FILE_NAME" -replace '\.pdf$', ''
          # BOM olmadan UTF-8 yazan özel PowerShell kod bloğu
          $configObj = @{
              productName = "$safeProductName"
              identifier  = "$env:IDENTIFIER"
              app         = @{
                  windows = @(
                      @{ title = "$env:WINDOW_TITLE" }
                  )
              }
          }
          # JSON'a çevir ve BOM kalıntısı olmadan kaydet
          $jsonContent = $configObj | ConvertTo-Json -Depth 5
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          
          # Dosyayı hem kök hem de src-tauri içine garanti olsun diye yazıyoruz
          [System.IO.File]::WriteAllText("$PWD/src-tauri/temp-config.json", $jsonContent, $utf8NoBom)
          [System.IO.File]::WriteAllText("$PWD/temp-config.json", $jsonContent, $utf8NoBom)

          Write-Host "Geçici Config Dosyası Üretildi:"
          Get-Content "src-tauri/temp-config.json"
          
      # 🌟 MASAÜSTÜ DERLEMESİ (Windows / Mac / Linux)
      - name: Build Tauri Desktop App
        if: needs.setup-build.outputs.target_platform != 'android'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_TOKEN }}
        with:
          tagName: v1.0.${{ github.run_number }}
          releaseName: '$PRODUCT_NAME - v1.0.${{ github.run_number }}'
          releaseDraft: false
          prerelease: false
          args: --config temp-config.json

      # 🌟 MOBİL DERLEME (Android APK)
      - name: Build Tauri Android App
        if: needs.setup-build.outputs.target_platform == 'android'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_TOKEN }}
        with:
          tagName: v1.0.${{ github.run_number }}
          releaseName: '$PRODUCT_NAME (Android) - v1.0.${{ github.run_number }}'
          releaseDraft: false
          prerelease: false
          args: android build --config temp-config.json
