name: On-Demand Flipbook Builder

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: 'Kitap Adı (Örn: Abonelik Sozlesmesi Davalari)'
        required: true
        default: 'Abonelik Söz. Kaynak.Alacak D.'
      identifier:
        description: 'Paket Kimliği (Örn: com.dosdijital.flipbook.alacakdavalari)'
        required: true
        default: 'com.dosdijital.flipbook.abonelik-söz-kaynak-alacak-d'
      window_title:
        description: 'Pencere Üst Başlığı'
        required: true
        default: 'ABONELİK SÖZLEŞMESİNDEN KAYNAKLANAN ALACAK DAVALARI'
      pdf_file_name:
        description: 'public/docs Klasöründeki PDF Dosya Adı'
        required: true
        default: 'abonelik-sozlesmesinden-kaynaklanan-alacak-davalari.pdf'
  # 🌟 WOOCOMMERCE WEBHOOK TETİKLEYİCİSİ:
  repository_dispatch:
    types: [build-flipbook]
jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install
        
      # 🌟 DİNAMİK DEĞİŞKENLERİ HAZIRLAMA (Hem Manuel hem Webhook destekler)
      - name: Set Build Variables
        shell: powershell
        run: |
          $productName = "${{ github.event.inputs.product_name }}"
          if ([string]::IsNullOrEmpty($productName)) { $productName = "${{ github.event.client_payload.product_name }}" }
          
          $identifier = "${{ github.event.inputs.identifier }}"
          if ([string]::IsNullOrEmpty($identifier)) { $identifier = "${{ github.event.client_payload.identifier }}" }
          
          $windowTitle = "${{ github.event.inputs.window_title }}"
          if ([string]::IsNullOrEmpty($windowTitle)) { $windowTitle = "${{ github.event.client_payload.window_title }}" }

          $pdfFileName = "${{ github.event.inputs.pdf_file_name }}"
          if ([string]::IsNullOrEmpty($pdfFileName)) { $pdfFileName = "${{ github.event.client_payload.pdf_file_name }}" }

          echo "PRODUCT_NAME=$productName" >> $env:GITHUB_ENV
          echo "IDENTIFIER=$identifier" >> $env:GITHUB_ENV
          echo "WINDOW_TITLE=$windowTitle" >> $env:GITHUB_ENV
          echo "PDF_FILE_NAME=$pdfFileName" >> $env:GITHUB_ENV  
      # 🌟 YENİ ADIM 1: Frontend Build (dist klasörünü oluşturur)
      
      - name: Build Frontend Assets
        run: |
          npm run build --if-present
          
      # 🌟 YENİ ADIM: JS İÇİNDEKİ PDF YOLUNU DİNAMİK OLARAK DEĞİŞTİRİR
      - name: Inject Active PDF File Name
        shell: powershell
        run: |
          $jsFile = "renderer.js" # Veya PDF yolunu tanımladığın JS/HTML dosyasının yolu
          if (Test-Path $jsFile) {
            (Get-Content $jsFile -Raw) -replace 'ACTIVE_PDF_FILE', '${{ inputs.pdf_file_name }}' | Set-Content $jsFile
            Write-Host "PDF dosyasi başarıyla enjekte edildi: ${{ inputs.pdf_file_name }}"
          } else {
            Write-Host "JS dosyasi bulunamadi, varsayılan PDF kullaniliyor."
          }
      - name: Build Tauri App with Dynamic Config
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_TOKEN }}
        with:
          tagName: v1.0.${{ github.run_number }}
          releaseName: '${{ inputs.product_name }} - v1.0.${{ github.run_number }}'
          releaseDraft: false
          prerelease: false
          # 🌟 DİNAMİK JSON OVERRIDE BURADA YAPILIYOR
          args: --config '{"productName":"${{ inputs.product_name }}", "identifier":"${{ inputs.identifier }}", "app":{"windows":[{"title":"${{ inputs.window_title }}"}]}}'
