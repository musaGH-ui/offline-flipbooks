name: "Tauri Dağıtım Derlemesi"

on:
  push:
    tags:
      - 'v*' # v1.0.0 gibi bir versiyon etiketi gönderildiğinde tetiklenir

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust Kurulumu
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Önbellekleme (Hız İçin)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux Ön Gereksinimlerini Kur (Sadece Ubuntu İçin)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Node Bağımlılıklarını Kur
        run: npm install
        
      - name: Dinamik Uygulama İsmi ve Kimliği 
        shell: bash
        run: |
          # 1. Projedeki PDF dosyasının adını uzantısız olarak yakala
          PDF_NAME=$(basename "$(ls docs/*.pdf | head -n 1)" .pdf)
          echo "Yakalanan E-Kitap Adı: $PDF_NAME"
          
          # 2. Windows kurulum çakışmasını önlemek için benzersiz bir App ID üret
          # md5sum alternatifi olarak Node.js veya bash hash alıyoruz (cross-platform uyumu için)
          UNIQUE_HASH=$(echo -n "$PDF_NAME" | openssl dgst -md5 | sed 's/^.* //')
          UNIQUE_ID="com.dos.flipbook.$UNIQUE_HASH"
          echo "Üretilen Benzersiz Kimlik: $UNIQUE_ID"
          
          # 3. tauri.conf.json dosyasını Node.js ile dinamik olarak güncelle
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            
            const pdfName = process.env.ENV_PDF_NAME;
            const uniqueId = process.env.ENV_UNIQUE_ID;
            
            // Yapısal alanları garantiye alıyoruz
            if (!conf.package) conf.package = {};
            if (!conf.tauri) conf.tauri = {};
            if (!conf.tauri.bundle) conf.tauri.bundle = {};
            
            // Uygulama ve Kurulum Paket İsmini Değiştir
            conf.package.productName = pdfName;
            conf.tauri.bundle.identifier = uniqueId;
            
            // Pencere Başlığını Değiştir
            if(conf.tauri.windows && conf.tauri.windows[0]) {
              conf.tauri.windows[0].title = pdfName;
            }
            
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
            console.log('tauri.conf.json başarıyla güncellendi.');
          "
        env:
          ENV_PDF_NAME: ${{ github.ref_name }} # Fallback riskine karşı tag ismini veya dinamik adı çevre değişkeni olarak bağlarız
          ENV_UNIQUE_ID: "com.dos.flipbook"
        
      - name: Tauri Uygulamasını Derle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DOS Flipbook ${{ github.ref_name }}"
          releaseBody: "Bulutta otomatik olarak üretilen kararlı masaüstü sürümleri."
          releaseDraft: false
          prerelease: false