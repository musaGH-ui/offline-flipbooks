name: "Tauri Dağıtım Derlemesi"

on:
  push:
    tags:
      - 'v*' # v1.0.0 gibi bir versiyon etiketi gönderildiğinde tetiklenir

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rust Kurulumu
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Önbellekleme (Hız İçin)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux Ön Gereksinimlerini Kur (Sadece Ubuntu İçin)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Node Bağımlılıklarını Kur
        run: npm install
        
      - name: Dinamik Uygulama İsmi ve Kimliği Ayarla
        shell: bash
        run: |
          # 1. Projedeki docs/ klasöründen tek olan PDF'in adını uzantısız yakala
          # Karakter uyumsuzluklarını önlemek için dosya adındaki boşlukları ve özel karakterleri temizliyoruz
          RAW_NAME=$(basename "$(ls www/docs/*.pdf | head -n 1 2>/dev/null)" .pdf)
          if [ -z "$RAW_NAME" ] || [ "$RAW_NAME" == "*.pdf" ] || [ "$RAW_NAME" == "" ]; then
            PDF_NAME="DOS-Flipbook"
          else
            # Dosya adındaki yasadışı veya kararsız karakterleri temizle
            PDF_NAME=$(echo "$RAW_NAME" | sed 's/[^a-zA-O-Z0-9_-]//g')
          fi
          echo "Yakalanan E-Kitap Adı: $PDF_NAME"
          
          # 2. Windows kurulum çakışmasını önlemek için benzersiz bir App ID üret
          # md5sum alternatifi olarak Node.js veya bash hash alıyoruz (cross-platform uyumu için)
          UNIQUE_HASH=$(echo -n "$PDF_NAME" | openssl dgst -md5 | sed 's/^.* //')
          UNIQUE_ID="com.dos.flipbook.$UNIQUE_HASH"
          echo "Üretilen Benzersiz Kimlik: $UNIQUE_ID"
          
          # 3. Ortam değişkenlerini Node betiğine güvenle aktarmak için dışa aktar
          export ENV_PDF_NAME="$PDF_NAME"
          export ENV_UNIQUE_ID="$UNIQUE_ID"
          
          # 4. Tauri v2 saf kök şemasına göre tauri.conf.json dosyasını güncelle
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
                      
            // 🌟 TAURI v2 KÖK DİZİN GÜNCELLEMELERİ
            conf.productName = process.env.ENV_PDF_NAME;
            conf.identifier = process.env.ENV_UNIQUE_ID;
                    
            // Pencere Başlığını Değiştir (v2'de app.windows veya doğrudan windows altındadır)
            if (conf.app && conf.app.windows && conf.app.windows[0]) {
              conf.app.windows[0].title = process.env.ENV_PDF_NAME;
            } else if (conf.windows && conf.windows[0]) {
              conf.windows[0].title = process.env.ENV_PDF_NAME;
            }
                      
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
            console.log('tauri.conf.json v2 şemasına göre başarıyla güncellendi.');
          "
        env:
          ENV_PDF_NAME: ${{ github.ref_name }} # Fallback riskine karşı tag ismini veya dinamik adı çevre değişkeni olarak bağlarız
          ENV_UNIQUE_ID: "com.dos.flipbook.default"
      
        # Tauri derlemeden hemen önce eğer bir build betiğiniz varsa tetikler
      - name: Frontend Projesini Derle
        run: npm run build --if-present
        
      - name: Tauri Uygulamasını Derle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TAURI_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DOS Flipbook ${{ github.ref_name }}"
          releaseBody: "Bulutta otomatik olarak üretilen kararlı masaüstü sürümleri."
          releaseDraft: false
          prerelease: false